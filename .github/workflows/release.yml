name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Build Configuration
        run: |
          # Ensure .env exists with placeholder if not provided via secrets
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || echo "DEEPSEEK_API_KEY=" > .env
          fi
          # Ensure gradlew wrapper exists
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Release
        run: |
          mkdir -p release-artifacts
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} release-artifacts/GameTranslator-debug.apk \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameTranslator-debug-apk
          path: release-artifacts/GameTranslator-debug.apk

      - name: Determine Release Tag
        id: tag_step
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_step.outputs.TAG_NAME }}
          name: Game Translator Release ${{ steps.tag_step.outputs.TAG_NAME }}
          draft: false
          prerelease: false
          make_latest: true
          files: release-artifacts/GameTranslator-debug.apk
          body: |
            ## 🎮 Game Translator - Android In-Game Overlay Translator

            ### 📦 Download & Installation
            - ดาวน์โหลดไฟล์ `GameTranslator-debug.apk` ด้านล่างไปติดตั้งบนอุปกรณ์ Android
            - อนุญาตสิทธิ์ **แสดงทับแอปอื่น (Display over other apps)**
            - อนุญาตสิทธิ์ **บันทึกหน้าจอ (MediaProjection)** เพื่อให้ระบบสามารถอ่านข้อความในเกมได้

            ### ✨ ฟีเจอร์ใหม่
            - บับเบิลลอยสำหรับแปลข้อความในเกมแบบรวดเร็ว
            - กดค้างที่บับเบิลเพื่อเลือกตีกรอบพื้นที่หน้าจอที่ต้องการแปลได้อย่างอิสระ
            - ระบบตั้งเวลาให้กล่องข้อความแปลหายไปโดยอัตโนมัติ (เลือกเวลาได้ 3, 5, 7, 10, 15 วินาที หรือแตะเพื่อปิดเอง)
            - ปรับปรุงประสิทธิภาพ ไม่เด้งหลุด และทำงานใน Background ได้อย่างเสถียร
            - รองรับ DeepSeek AI และเลือกสรรพนาม/สไตล์การแปลได้ตามต้องการ
